<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Commodities Watch</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9bb4; --up:#3ddc97; --down:#ff6b6b; --accent:#4da3ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; }
  header { padding:28px 24px 8px; border-bottom:1px solid #243044; }
  header h1 { font-size:1.6rem; letter-spacing:.5px; }
  header p { color:var(--muted); font-size:.9rem; margin-top:4px; }
  .toolbar { display:flex; gap:12px; align-items:center; padding:16px 24px; flex-wrap:wrap; }
  .toolbar button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:.85rem; cursor:pointer; }
  .toolbar button:hover { filter:brightness(1.1); }
  .toolbar .ts { color:var(--muted); font-size:.8rem; margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; padding:0 24px 32px; }
  .card { background:var(--card); border-radius:10px; padding:16px; border:1px solid #243044; transition:transform .15s; }
  .card:hover { transform:translateY(-2px); }
  .card .sym { font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .card .name { font-size:1.05rem; font-weight:600; margin:2px 0 10px; }
  .card .price { font-size:1.55rem; font-weight:700; }
  .card .chg { font-size:.9rem; margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .err { color:var(--down); font-size:.8rem; }
  .loading { color:var(--muted); padding:40px; text-align:center; }
  footer { color:var(--muted); font-size:.75rem; padding:0 24px 24px; }
  @media (max-width:600px){ header h1{font-size:1.3rem;} .grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<header>
  <h1>Food Commodities Watch</h1>
  <p>Restaurant cost radar &mdash; grains, sweeteners, softs, livestock</p>
</header>
<div class="toolbar">
  <button onclick="loadAll()">Refresh</button>
  <span class="ts" id="ts">loading...</span>
</div>
<div class="grid" id="grid"><div class="loading">Pulling live prices from Stooq...</div></div>
<footer>Data: Stooq (stooq.com) via CSV. Not financial advice. For menu cost tracking.</footer>
<script src="fetch.js"></script>
</body>
</html>
